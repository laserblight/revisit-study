# ReVISit reverse proxy — replaces the default nginx site on port 80.
# Routes Supabase API paths to Kong and everything else to the study app.
# TLS is handled upstream by the NCSU proxy (or any external LB).
#
# Install:
#   sudo cp deploy/digitalocean/nginx-revisit.conf /etc/nginx/sites-available/revisit
#   sudo rm  /etc/nginx/sites-enabled/default
#   sudo ln -s /etc/nginx/sites-available/revisit /etc/nginx/sites-enabled/revisit
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50m;

    # --- Supabase API routes → Kong (port 8100) ---
    location ~ ^/(auth|rest|storage|realtime|graphql)/v1 {
        proxy_pass         http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket support (needed for Realtime)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Study app → reVISit container (port 3001) ---
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
